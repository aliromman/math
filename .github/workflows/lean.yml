name: Lean
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: "2"
      VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
      VERIFY_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select verification scope
        id: scope
        shell: bash
        run: |
          if [[ -n "$VERIFY_BASE" ]]; then
            test "$(git rev-parse HEAD^1)" = "$VERIFY_BASE"
            test "$(git rev-parse HEAD^2)" = "$VERIFY_HEAD"
          fi
          mode=$(python3 scripts/verify.py --mode --base "$VERIFY_BASE")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Verification mode: $mode"
      - name: Install Elan
        if: steps.scope.outputs.mode != 'docs'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build, replay and audit the selected proofs
        run: python3 scripts/verify.py --base "$VERIFY_BASE" --fetch-cache
      - name: Test the verification gates
        if: steps.scope.outputs.mode == 'full'
        run: |
          python3 scripts/test_verify.py
          python3 scripts/test_selection.py
